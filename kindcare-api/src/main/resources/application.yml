server:
  port: 8081

spring:
  application:
    name: kindcare-api

  datasource:
    url: jdbc:h2:file:./data/kindcare;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        "[format_sql]": true


  security:
    user:
      name: user
      password: 1234

jwt:
  secret: kindcare-secret-key-must-be-at-least-256-bits-long-for-hs256-algorithm
  expiration: 86400000